[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Dependencies (supabase-js, workbox-build, ...) require Node >= 22.
  NODE_VERSION = "22"

# Single-page app: send every path to index.html so /cart, /ride, /login etc.
# work on refresh and when opened directly. Real files (assets, sw.js) still win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# PWA: the service worker and manifest must never be cached by the CDN/browser,
# otherwise users get stuck on an old build after you deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
